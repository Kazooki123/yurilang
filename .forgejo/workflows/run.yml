name: Run & Test YuriLang

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  run-yurilang:
    runs-on: codeberg-medium

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            mesa-common-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            pkg-config \
            libsdl2-dev \
            libfreetype6-dev \
            libportmidi-dev \
            python3-dev \
            xvfb \
            libflac-dev

      - name: Prepare vendor libraries for Linux
        run: |
          echo "Current directory: $(pwd)"
          echo "Listing root contents:"
          ls -la

          mkdir -p bin

          LIBFLAC=$(find /usr/lib -name 'libflac.so*' | head -n 1)
          if [ -n "$LIBFLAC" ]; then
            echo "Found libflac at: $LIBFLAC"
            ln -sf "$LIBFLAC" bin/libflac.so
            echo "Created symlink:"
            ls -la bin/libflac.so
          else
            echo "ERROR: libflac.so not found in system"
            exit 1
          fi

      - name: Run and Test YuriLang
        run: |
          ls -la bin/   # debug: confirm the symlink exists
          xvfb-run -a python yuri.py example/test.yuri
          
      - name: Install Python packages
        run: |
          pip install --upgrade pip
          pip install llvmlite
          pip install pygame-ce

      - name: Prepare vendor libraries for Linux
        run: |
          mkdir -p bin
          # Symlink the system libflac to the name your code expects
          ln -sf /usr/lib/x86_64-linux-gnu/libflac.so.* bin/libflac.so 2>/dev/null || \
          ln -sf /usr/lib/x86_64-linux-gnu/libflac.so.8 bin/libflac.so || \
          echo "Warning: Could not find libflac.so"

      - name: Run and Test YuriLang
        run: |
          xvfb-run -a python yuri.py example/test.yuri
