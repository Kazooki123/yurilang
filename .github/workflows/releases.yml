# YuriLang Release Pipeline  🪿
# "She ships herself." — Triggered on version tags (v*)
#
# Builds packages for:
#   Fedora  → .rpm  (yurilang.spec)
#   Debian  → .deb  (deb/control)
#   Arch    → .pkg.tar.zst (PKGBUILD)
#   Alpine  → .apk  (APKBUILD) [skipped — no code yet]
#   FreeBSD → .txz  (Makefile)
#   NixOS   → .drv  (default.nix / flake.nix)

name: YuriLang Release

on:
  push:
      tags:
          - "v*.*.*"

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.4.0)"
        required: true
        default: "v1.4.0"

env:
  PYTHON_VERSION: "3.13"
  YURILANG_VERSION: ${{ github.ref_name }}

jobs:
  prepare:
    name: 📋 Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      version_plain: ${{ steps.get_version.outputs.version_plain }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "refs/heads/main" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          fi
          VERSION_PLAIN="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_plain=$VERSION_PLAIN" >> $GITHUB_OUTPUT
          echo "Building YuriLang $VERSION 🪷"

  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install llvmlite reportlab

      - name: Run basic interpreter test
        run: |
          cat > /tmp/test_basic.yuri << 'EOF'
          @wlw:
              @bond x = @add 5 3
              @confess x
          EOF
          python yuri.py /tmp/test_basic.yuri

      - name: Run Hello World test
        run: |
          cat > /tmp/test_hello.yuri << 'EOF'
          @wlw:
              @confess "Hello, World!"
          EOF
          python yuri.py /tmp/test_hello.yuri

      - name: Run boolean test
        run: |
          cat > /tmp/test_bool.yuri << 'EOF'
          @wlw:
              @bond feeling = love
              @jealous feeling == love:
                  @confess "Yuring Complete"
          EOF
          python yuri.py /tmp/test_bool.yuri

      - name: Run pattern matching test
        run: |
          cat > /tmp/test_match.yuri << 'EOF'
          @wlw:
              @bond mood = "inlove"
              @sappho mood:
                  @poet "inlove":
                      @confess "She knows."
                  @poet _:
                      @confess "Not yet."
          EOF
          python yuri.py /tmp/test_match.yuri

  build-fedora:
    name: 📦 Fedora RPM
    runs-on: ubuntu-latest
    needs: [prepare, test]
    container: fedora:latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          dnf install -y rpm-build python3 python3-pip rpmdevtools

      - name: Set up RPM build tree
        run: rpmdev-setuptree

      - name: Update version in spec
        run: |
          VERSION="${{ needs.prepare.outputs.version_plain }}"
          sed -i "s/^Version:.*/Version: $VERSION/" pkg/fedora/yurilang.spec

      - name: Create source tarball
        run: |
          VERSION="${{ needs.prepare.outputs.version_plain }}"
          mkdir -p /root/rpmbuild/SOURCES
          tar czf /root/rpmbuild/SOURCES/yurilang-${VERSION}.tar.gz \
            --transform "s,^,yurilang-${VERSION}/," \
            --exclude='.git' \
            --exclude='pkg' \
            --exclude='__pycache__' \
            .

      - name: Copy spec file
        run: |
          cp pkg/fedora/yurilang.spec /root/rpmbuild/SPECS/

      - name: Build RPM
        run: |
          VERSION="${{ needs.prepare.outputs.version_plain }}"
          rpmbuild -bb /root/rpmbuild/SPECS/yurilang.spec

      - name: Find and move RPM
        run: |
          VERSION="${{ needs.prepare.outputs.version_plain }}"
          find /root/rpmbuild/RPMS -name "*.rpm" -exec cp {} . \;
          ls -la *.rpm

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: fedora-rpm
          path: "*.rpm"
          retention-days: 1

  build-arch:
    name: 📦 Arch Linux Package
    runs-on: ubuntu-latest
    needs: [prepare, test]
    container: archlinux:latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          pacman -Sy --noconfirm base-devel python python-pip git sudo

      - name: Create build user (makepkg refuses root)
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .

      - name: Update version in PKGBUILD
        run: |
          VERSION="${{ needs.prepare.outputs.version_plain }}"
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" pkg/arch/PKGBUILD

      - name: Copy PKGBUILD to workspace
        run: |
          cp pkg/arch/PKGBUILD .
          chown builder:builder PKGBUILD

      - name: Build Arch package
        run: |
          su builder -c "makepkg -sf --noconfirm"
          ls -la *.pkg.tar.zst

      - name: Upload Arch artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch-pkg
          path: "*.pkg.tar.zst"
          retention-days: 1

  build-freebsd:
    name: 📦 FreeBSD Port
    runs-on: ubuntu-latest
    needs: [prepare, test]

    steps:
      - uses: actions/checkout@v4

      - name: Create FreeBSD port tarball
        run: |
          VERSION="${{ needs.prepare.outputs.version_plain }}"

          mkdir -p freebsd-port/yurilang

          cp pkg/freebsd/Makefile freebsd-port/yurilang/
          cp -r . freebsd-port/yurilang/files/ 2>/dev/null || \
          mkdir -p freebsd-port/yurilang/files

          sha256sum freebsd-port/yurilang/files/* 2>/dev/null | \
          awk '{print "SHA256 ("$2") = "$1}' > \
          freebsd-port/yurilang/distinfo || true

          tar czf "yurilang-${VERSION}-freebsd-port.tar.gz" \
          freebsd-port/

      - name: Upload FreeBSD artifact
        uses: actions/upload-artifact@v4
        with:
          name: freebsd-port
          path: "*.tar.gz"
          retention-days: 1

  build-nix:
    name: 📦 NixOS Derivation
    runs-on: ubuntu-latest
    needs: [prepare, test]

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v26
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-flakes nix-command

      - name: Update version in flake.nix
        run: |
          VERSION="${{ needs.prepare.outputs.version_plain }}"
          if [ -f flake.nix ]; then
            sed -i "s/version = \".*\"/version = \"$VERSION\"/" flake.nix
          fi

      - name: Build Nix derivation
        run: |
          nix build .#yurilang --no-link --print-build-logs || \
          nix-build pkg/nix/default.nix --no-out-link

      - name: Package Nix output
        run: |
          VERSION="${{ needs.prepare.outputs.version_plain }}"

          mkdir -p nix-dist
          cp flake.nix flake.lock nix-dist/ 2>/dev/null || true
          cp pkg/nix/default.nix nix-dist/ 2>/dev/null || true
          tar czf "yurilang-${VERSION}-nix.tar.gz" nix-dist/

      - name: Upload Nix artifact
        uses: actions/upload-artifact@v4
        with:
          name: nix-derivation
          path: "yurilang-*-nix.tar.gz"
          retention-days: 1"

  build-source:
    name: 📦 Source Tarball
    runs-on: ubuntu-latest
    needs: [prepare, test]

    steps:
      - uses: actions/checkout@v4

      - name: Build source tarball
        run: |
          VERSION="${{ needs.prepare.outputs.version_plain }}"
          tar czf "yurilang-${VERSION}-source.tar.gz" \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.github' \
            .

      - name: Build source zip
        run: |
          VERSION="${{ needs.prepare.outputs.version_plain }}"
          zip -r "yurilang-${VERSION}-source.zip" . \
            -x "*.git*" \
            -x "__pycache__/*" \
            -x "*.pyc"

      - name: Upload source artifacts
        uses: actions/upload-artifact@v4
        with:
          name: source
          path: |
            yurilang-*-source.tar.gz
            yurilang-*-source.zip
          retention-days: 1

  release:
    name: 🚀 Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-fedora
      - build-debian
      - build-arch
      - build-freebsd
      - build-nix
      - build-source

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List artifacts
        run: |
          echo "📦 Release artifacts:"
          ls -la release-artifacts/

      - name: Generate release notes
        id: release_notes
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          VERSION_PLAIN="${{ needs.prepare.outputs.version_plain }}"

          cat > release_notes.md << EOF
          # YuriLang ${VERSION} 🩷

          > *"Yuring Complete since 2026"*

          ## Installation

          ### Linux (Universal)
          \`\`\`bash
          curl -sSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash
          \`\`\`

          ### Fedora
          \`\`\`bash
          sudo rpm -i yurilang-${VERSION_PLAIN}-*.rpm
          \`\`\`

          ### Debian / Ubuntu 
          \`\`\`bash
          sudo dpkg -i yurilang_${VERSION_PLAIN}_all.deb
          \`\`\`

          ### Arch Linux
          \`\`\`bash
          sudo pacman -U yurilang-${VERSION_PLAIN}-*.pkg.tar.zst
          \`\`\`

          ### NixOS 
          \`\`\`nix
          inputs.yurilang.url = "github:${{ github.repository }}/${VERSION}";
          \`\`\`

          ### FreeBSD
          \`\`\`bash
          tar xzf yurilang-${VERSION_PLAIN}-freebsd-port.tar.gz
          cd freebsd-port/yurilang && make install
          \`\`\`

          ## Quick Start 
          \`\`\`
          @wlw:
              @confess "Hello, World!"
          \`\`\`
          \`\`\`bash
          yuri hello.yuri
          \`\`\`

          ## What's New 
          See [CHANGELOG.md](CHANGELOG.md) for full details.

          ## Execution Targets 
          | Command | Output |
          |---------|--------|
          | \`yuri program.yuri\` | Interpret |
          | \`yuri program.yuri --bytecode\` | YuriVM bytecode |
          | \`yuri program.yuric --vm\` | Run bytecode |
          | \`yuri program.yuri --compile\` | x86-64 ASM |
          | \`yuri program.yuri --glc\` | Native ELF binary |
          | \`yuri program.yuri --yasm\` | WebAssembly |
          | \`yuri program.yuri --llvm\` | LLVM IR |
          | \`yuri program.yuri --llvm-obj\` | Native object |

          ---
          *Built with love for lesbians, Yuri media, and anyone who believes code should have a soul. 🪷*
          EOF

          echo "notes_file=release_notes.md" >> $GITHUB_OUTPUT 

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: "YuriLang ${{ needs.prepare.outputs.version }} 🪷"
          body_file: release_notes.md
          draft: false
          prerelease: ${{ contains(needs.prepare.outputs.version, 'alpha') || contains(needs.prepare.outputs.version, 'beta') || contains(needs.prepare.outputs.version, 'rc') }}
          files: |
            release-artifacts/*.rpm
            release-artifacts/*.deb
            release-artifacts/*.pkg.tar.zst
            release-artifacts/*.tar.gz
            release-artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.ACTION_TOKEN }}

notify:
    name: 🌸 Release Complete
    runs-on: ubuntu-latest
    needs: release
    if: always()

    steps:
      - name: Success message
        if: needs.release.result == 'success'
        run: |
          echo "YuriLang ${{ needs.prepare.outputs.version }} released!"
          echo ""
          echo "Packages built:"
          echo "  ✅ Fedora RPM"
          echo "  ✅ Debian DEB"
          echo "  ✅ Arch pkg.tar.zst"
          echo "  ✅ FreeBSD port"
          echo "  ✅ NixOS derivation"
          echo "  ✅ Source tarball + zip"
          echo ""
          echo "Yuring Complete"

      - name: Failure message
        if: needs.release.result == 'failure'
        run: |
          echo "💔 Release failed. She tried. Check the logs."
          exit 1

