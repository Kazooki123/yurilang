name: 🌸 YuriLang CI

on:
  push:
    branches: [main, dev, "feature/*"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: 🧪 Test on ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}

    strategy:
          fail-fast: false
          matrix:
            os: [ubuntu-latest, macos-latest, windows-latest]
            python: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install llvmlite reportlab

      - name: Test — Hello World
        run: |
          python yuri.py tests/hello.yuri

      - name: Test — Math
        run: |
          python yuri.py tests/math.yuri

      - name: Test — Pattern matching
        run: |
          python yuri.py tests/pattern.yuri

      - name: Test — Loops
        run: |
          python yuri.py tests/loops.yuri

      - name: Test — Functions
        run: |
          python yuri.py tests/functions.yuri

      - name: Test — Bytecode VM
        run: |
          python yuri.py tests/hello.yuri --bytecode
          python yuri.py tests/hello.yuric --vm

      - name: Test — LLVM IR (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
        python yuri.py tests/hello.yuri --llvm

  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check src/ vm/ --ignore E501,E402
        continue-on-error: true

